<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Yelo! Messenger</title>
<style>
:root{--bg:#0b0b0b;--card:#161616;--line:#2a2a2a;--gold:#d4af37;--gold2:#f1d77a;--text:#fff;--muted:#9a9a9a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);max-width:640px;margin:auto}
.brand{font-weight:800;font-size:20px;background:linear-gradient(90deg,#b8860b,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding:12px 14px 96px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:flex;background:#0f0f0f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 0;font-size:12px}
nav button.on{color:var(--gold);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.gold{background:linear-gradient(135deg,#b8860b,var(--gold2),var(--gold));color:#111;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;cursor:pointer}
input,textarea,select{width:100%;background:#0f0f0f;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:16px;margin:4px 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{background:var(--gold);color:#111;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 8px;font-size:11px;margin-left:6px}
.bubble{max-width:78%;padding:8px 12px;border-radius:14px;margin:6px 0;font-size:15px}
.me{margin-left:auto;background:linear-gradient(135deg,#b8860b,var(--gold));color:#111}
.them{background:var(--card);border:1px solid var(--line)}
.price{color:var(--gold2);font-weight:700}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#222;flex:none}
.notice{font-size:12px;color:var(--gold);border:1px dashed var(--gold);border-radius:10px;padding:8px;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="row" style="gap:10px"><img src="icon-192.png" alt="Yelo! logo" width="34" height="34" style="border-radius:9px"><div class="brand">Yelo!</div></div><div class="muted" id="biz"></div></header>
<main id="view"></main>
<nav>
  <button data-t="chats" onclick="setTab('chats')">Chats</button>
  <button data-t="catalog" onclick="setTab('catalog')">Catalog</button>
  <button data-t="status" onclick="setTab('status')">Status</button>
  <button data-t="calls" onclick="setTab('calls')">Calls</button>
  <button data-t="directory" onclick="setTab('directory')">Directory</button>
  <button data-t="profile" onclick="setTab('profile')">Profile</button>
</nav>
<div id="ov" class="overlay hidden"></div>

<script>
const KEY = 'yelo.v1';
const blank = {profile:{name:'My Business',phone:'',address:''},chats:[],products:[],statuses:[],calls:[],listings:[],admin:{pin:'',payTo:''}};
let db;
let tab = 'chats', openChat = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = t => new Date(t).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const kina = n => 'PGK ' + Number(n || 0).toFixed(2);

function load(){
  try { db = Object.assign(structuredClone(blank), JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch(e){ db = structuredClone(blank); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch(e){ alert('Could not save on this device. Storage may be full or blocked.'); return false; }
}

function setTab(t){ tab = t; openChat = null; render(); }

function render(){
  const a = document.activeElement;
  const focusId = a && a.id, caret = a && a.selectionStart;
  $('#biz').textContent = db.profile.name;
  const views = {chats: renderChats, catalog: renderCatalog, status: renderStatus, calls: renderCalls, directory: renderDirectory, admin: renderAdmin, profile: renderProfile};
  $('#view').innerHTML = views[tab]();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  // Restore focus so typing in the search box is not interrupted.
  if (focusId && focusId !== 'pin' && focusId !== 'rv') {
    const n = document.getElementById(focusId);
    if (n) { n.focus(); try { n.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

/* ---------- CHATS ---------- */
function renderChats(){
  if (openChat){
    const c = db.chats.find(x => x.id === openChat);
    if (!c){ openChat = null; return renderChats(); }
    c.unread = 0; save();
    return `<div class="row"><button class="ghost" onclick="openChat=null;render()">← Back</button>
      <div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.phone || 'No number saved')}</div></div></div>
      <div style="margin-top:10px">${c.msgs.map(m => `<div class="bubble ${m.from === 'me' ? 'me' : 'them'}">${esc(m.text)}
        <div style="font-size:11px;opacity:.7">${fmt(m.t)}</div></div>`).join('') || '<p class="muted">No messages yet.</p>'}</div>
      <div class="row"><input id="msg" placeholder="Type a message" style="margin:0"><button class="gold" onclick="sendMsg()">Send</button></div>
      <p class="muted">Messages are saved on this device only. They do not reach the customer's phone yet.</p>`;
  }
  const q = ($('#q') ? $('#q').value : '').toLowerCase();
  const list = db.chats.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
  return `<input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search customers by name or phone" value="${esc(q)}" oninput="render()">
    <div class="card"><strong>Add customer</strong>
      <input id="cn" placeholder="Customer name"><input id="cp" placeholder="Phone number">
      <button class="gold" onclick="addContact()">Add customer</button></div>
    ${list.map(c => { const last = c.msgs[c.msgs.length - 1]; return `
      <div class="card" style="cursor:pointer" onclick="openChat='${c.id}';render()">
        <div class="row" style="justify-content:space-between"><strong>${esc(c.name)}</strong>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>
        <div class="muted">${last ? esc(last.text) : 'No messages yet'}</div></div>`; }).join('')
      || '<p class="muted">No customers yet. Add one above.</p>'}
    <p class="muted"><button class="ghost" onclick="simIncoming()">Simulate incoming message</button> <span class="tag">Simulated</span></p>`;
}
function addContact(){
  const n = $('#cn').value.trim(), p = $('#cp').value.trim();
  if (!n) return alert('Enter a customer name');
  db.chats.unshift({id: uid(), name: n, phone: p, unread: 0, msgs: []});
  save(); render();
}
function sendMsg(){
  const t = $('#msg').value.trim(); if (!t) return;
  const c = db.chats.find(x => x.id === openChat);
  c.msgs.push({from: 'me', text: t, t: Date.now()});
  save(); render();
}
function simIncoming(){
  if (!db.chats.length) db.chats.push({id: uid(), name: 'Demo customer', phone: '', unread: 0, msgs: []});
  const c = db.chats[0];
  c.msgs.push({from: 'them', text: 'Hi, is this still available? (simulated)', t: Date.now()});
  c.unread++; save(); render();
}

/* ---------- CATALOG ---------- */
function renderCatalog(){
  return `<div class="card"><strong>Add product or service</strong>
    <input id="pn" placeholder="Name">
    <input id="pp" type="number" min="0" step="0.01" placeholder="Price in PGK (Kina)">
    <textarea id="pd" rows="2" placeholder="Description"></textarea>
    <input id="pf" type="file" accept="image/*">
    <button class="gold" onclick="addProduct()">Save item</button></div>
    ${db.products.map(p => `<div class="card row">
      ${p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : `<div class="thumb"></div>`}
      <div style="flex:1"><strong>${esc(p.name)}</strong> <span class="price">${kina(p.price)}</span>
        <div class="muted">${esc(p.desc)}</div></div>
      <button class="ghost" onclick="delProduct('${p.id}')">Remove</button></div>`).join('')
      || '<p class="muted">Your catalog is empty.</p>'}`;
}
async function addProduct(){
  const name = $('#pn').value.trim();
  if (!name) return alert('Enter a name');
  const price = parseFloat($('#pp').value) || 0;
  const desc = $('#pd').value.trim();
  const photo = await shrink($('#pf').files[0]);
  db.products.push({id: uid(), name, price, desc, photo});
  if (save()) render();
}
function shrink(file){
  return new Promise(res => {
    if (!file) return res('');
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 400 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => res('');
    img.src = url;
  });
}
function delProduct(id){ db.products = db.products.filter(p => p.id !== id); save(); render(); }

/* ---------- STATUS ---------- */
function renderStatus(){
  return `<div class="card"><strong>Post a status</strong>
    <select id="sk"><option value="text">Update</option><option value="offer">Offer</option></select>
    <textarea id="st" rows="2" placeholder="e.g. 10% off all coffee this week"></textarea>
    <input id="sf" type="file" accept="image/*">
    <button class="gold" onclick="postStatus()">Post</button></div>
    ${db.statuses.filter(s => Date.now() - s.t < 24 * 60 * 60 * 1000).map(s => `<div class="card">${s.kind === 'offer' ? '<span class="tag">Offer</span>' : ''}
      ${s.photo ? `<img src="${s.photo}" alt="" style="width:100%;border-radius:12px;margin-top:6px">` : ''}
      <div style="margin-top:4px">${esc(s.text)}</div><div class="muted">${fmt(s.t)}</div></div>`).join('')
      || '<p class="muted">No statuses yet.</p>'}
    <p class="muted">Statuses disappear after 24 hours.</p>`;
}
async function postStatus(){
  const t = $('#st').value.trim();
  const photo = await shrink($('#sf').files[0]);
  if (!t && !photo) return alert('Add some text or a photo');
  db.statuses.unshift({id: uid(), kind: $('#sk').value, text: t, photo, t: Date.now()});
  if (save()) render();
}

/* ---------- CALLS (prototype) ---------- */
function renderCalls(){
  return `<div class="notice">Calls are a prototype. Real voice and video calling is not connected, so calls will not reach anyone.</div>
    <div class="card"><strong>Start a simulated call</strong>
    ${db.chats.map(c => `<div class="row" style="justify-content:space-between;margin:8px 0">
      <span>${esc(c.name)}</span>
      <span><button class="ghost" onclick="startCall('${c.id}','voice')">Voice</button>
      <button class="ghost" onclick="startCall('${c.id}','video')">Video</button></span></div>`).join('')
      || '<p class="muted">Add a customer first.</p>'}</div>
    <div class="card"><strong>Call history</strong>
    ${db.calls.map(k => `<div class="muted" style="margin-top:6px">${esc(k.name)} · ${k.kind} · ${fmt(k.t)} <span class="tag">Simulated</span></div>`).join('')
      || '<p class="muted">No calls yet.</p>'}</div>`;
}
function startCall(id, kind){
  const c = db.chats.find(x => x.id === id);
  db.calls.unshift({id: uid(), name: c.name, kind, t: Date.now()}); save();
  $('#ov').innerHTML = `<div><strong>${kind} call to ${esc(c.name)}</strong></div>
    <div class="muted">Simulated. Not connected.</div>
    <button class="gold" onclick="$('#ov').classList.add('hidden');render()">End call</button>`;
  $('#ov').classList.remove('hidden');
  render();
}

/* ---------- DIRECTORY (simulated) ---------- */
const CATS = ['Retail','Food & Drink','Services','Construction','Agriculture','Transport','Health','Other'];
let reg = null; // registration in progress: {step, name, category, town, phone, desc}

function renderDirectory(){
  const mine = db.listings.find(l => l.mine);
  const q = ($('#dq') ? $('#dq').value : '').toLowerCase();
  const list = db.listings.filter(l => !l.mine && l.verified &&
    (!q || l.name.toLowerCase().includes(q) || l.category.toLowerCase().includes(q) || l.town.toLowerCase().includes(q)));
  let top;
  if (!mine) top = regCard();
  else if (!mine.verified) top = `<div class="card"><strong>${esc(mine.name)}</strong> <span class="tag">${mine.paid ? 'Waiting for verification' : 'Awaiting payment check'}</span>
      <div class="muted">Reference ${esc(mine.ref)}. Your listing goes live once it is checked.</div></div>`;
  else top = `<div class="card"><strong>${esc(mine.name)}</strong> <span class="tag">Verified</span>
      <div class="muted">Your listing is shown in the directory.</div></div>`;
  return `<div class="notice">Directory is a prototype. Listings are saved on this device only, so other businesses cannot see them yet. Payments and verification codes are simulated.</div>
    ${top}
    <input id="dq" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search by name, category or town" value="${esc(q)}" oninput="render()">
    ${list.map(l => `<div class="card"><strong>${esc(l.name)}</strong> <span class="tag">${esc(l.category)}</span>
      <div class="muted">${esc(l.town)} · ${esc(l.phone)}</div><div style="margin-top:6px">${esc(l.desc)}</div></div>`).join('')
      || '<p class="muted">No verified businesses to show yet.</p>'}`;
}
function regCard(){
  if (!reg) reg = {step: 'form', name: '', category: CATS[0], town: '', phone: '', desc: ''};
  if (reg.step === 'form') return `<div class="card"><strong>Register your business</strong>
    <input id="rn" placeholder="Business name" value="${esc(reg.name)}">
    <select id="rc">${CATS.map(c => `<option${c === reg.category ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <input id="rt" placeholder="Town" value="${esc(reg.town)}">
    <input id="rp" placeholder="Phone number" value="${esc(reg.phone)}">
    <textarea id="rd" rows="2" maxlength="200" placeholder="Short description (max 200 characters)">${esc(reg.desc)}</textarea>
    <button class="gold" onclick="regNext()">Continue</button></div>`;
  if (reg.step === 'verify') return `<div class="card"><strong>Verify your phone</strong>
    <div class="muted">Simulated: a 6-digit code would be sent by SMS to ${esc(reg.phone)}. In this prototype, the code is 123456.</div>
    <input id="rv" inputmode="numeric" maxlength="6" placeholder="6-digit code">
    <button class="gold" onclick="regVerify()">Verify</button></div>`;
  return `<div class="card"><strong>Registration fee: K10 (one-time)</strong>
    <div class="muted">Pay to:</div><strong>${esc(db.admin.payTo || 'Payment details not set yet')}</strong>
    <div class="muted" style="margin-top:8px">Use this reference when you pay:</div><strong>${esc(reg.ref)}</strong>
    <input id="rr" placeholder="Your payment reference or transaction ID" style="margin-top:8px">
    <button class="gold" onclick="regSubmit()">I have paid</button></div>`;
}
function regNext(){
  reg.name = $('#rn').value.trim(); reg.category = $('#rc').value; reg.town = $('#rt').value.trim();
  reg.phone = $('#rp').value.trim(); reg.desc = $('#rd').value.trim().slice(0, 200);
  if (!reg.name || !reg.town || !reg.phone) return alert('Enter business name, town and phone number');
  reg.step = 'verify'; render();
}
function regVerify(){
  if ($('#rv').value.trim() !== '123456') return alert('Wrong code. In this prototype the code is 123456.');
  reg.ref = 'YEL' + uid().slice(-5).toUpperCase();
  reg.step = 'pay'; render();
}
function regSubmit(){
  const pr = $('#rr').value.trim();
  if (!pr) return alert('Enter your payment reference');
  db.listings.unshift({id: uid(), mine: true, name: reg.name, category: reg.category, town: reg.town,
    phone: reg.phone, desc: reg.desc, ref: reg.ref, payRef: pr, paid: false, verified: false, t: Date.now()});
  reg = null; save(); render();
}

/* ---------- ADMIN DASHBOARD ---------- */
let adminOpen = false;

function renderAdmin(){
  if (!adminOpen){
    const first = !db.admin.pin || db.admin.pin.length !== 64;
    return `<div class="card"><strong>${first ? 'Create admin PIN' : 'Admin login'}</strong>
      <div class="muted">${first ? 'Choose a PIN for this device. Only you should know it.' : 'Ente
